<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2633"/>
      <stop offset="1" stop-color="#15131b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#b8862c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- handle -->
  <line x1="160" y1="160" x2="214" y2="214" stroke="#9c7124" stroke-width="34" stroke-linecap="round"/>
  <line x1="160" y1="160" x2="214" y2="214" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <!-- lens -->
  <circle cx="112" cy="112" r="70" fill="#0f0e14"/>
  <!-- gem: the item under evaluation -->
  <polygon points="112,56 156,100 112,162 68,100" fill="#2f7fd0"/>
  <polygon points="112,56 156,100 112,100" fill="#8fd8ff"/>
  <polygon points="112,56 112,100 68,100" fill="#5bb4f0"/>
  <polygon points="68,100 112,100 112,162" fill="#2a6fb8"/>
  <polygon points="156,100 112,100 112,162" fill="#1d5596"/>
  <circle cx="112" cy="112" r="70" fill="none" stroke="url(#gold)" stroke-width="18"/>
</svg>
